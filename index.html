<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Senthil Gym">
  <title>Senthil Gym</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #141414;
      --panel-2: #1d1d1d;
      --text: #f8f7f2;
      --muted: #aaa59a;
      --line: #2b2b2b;
      --fire: #ff4d1f;
      --gold: #ffbf3f;
      --green: #34d399;
      --blue: #38bdf8;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app { width: min(100%, 620px); min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
    header { padding: 18px 16px 12px; position: sticky; top: 0; z-index: 10; background: rgba(8,8,8,.94); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,.06); }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; line-height: 1; letter-spacing: 0; }
    h2 { font-size: 20px; margin-top: 4px; }
    h3 { font-size: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 8px; background: linear-gradient(135deg, var(--fire), var(--gold)); color: #111; font-weight: 900; box-shadow: 0 10px 30px rgba(255,77,31,.22); }
    .quote { margin-top: 12px; color: var(--muted); font-size: 14px; line-height: 1.35; }
    main { flex: 1; padding: 14px 14px 88px; }
    .screen { display: none; }
    .screen.active { display: block; animation: rise .16s ease-out; }
    @keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stack { display: grid; gap: 10px; }
    .card, .tile, .exercise, .setting-row { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .card { padding: 14px; }
    .tile { min-height: 78px; padding: 14px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; cursor: pointer; }
    .tile strong { font-size: 17px; }
    .tile span, .muted { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .primary { background: linear-gradient(135deg, var(--fire), #ff8a2a); color: #140600; border: 0; font-weight: 900; }
    .accent { color: var(--gold); }
    .pill { display: inline-flex; align-items: center; width: max-content; gap: 6px; min-height: 24px; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .progress { height: 7px; background: #252525; border-radius: 999px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--fire), var(--gold)); width: 0%; }
    .tabs { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 620px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(8,8,8,.96); border-top: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(18px); }
    .tab { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; min-height: 46px; display: grid; place-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
    .tab b { font-size: 18px; line-height: 1; color: var(--text); }
    .tab.active { border-color: rgba(255,191,63,.7); color: var(--gold); }
    .back { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 11px; min-width: 44px; }
    .section-title { margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: end; gap: 10px; }
    .list-only { margin: 0; padding-left: 18px; color: var(--muted); line-height: 1.55; font-size: 14px; }
    .exercise { padding: 12px; display: grid; gap: 10px; }
    .exercise-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
    .demo { border: 1px solid rgba(255,191,63,.35); background: rgba(255,191,63,.08); color: var(--gold); text-decoration: none; border-radius: 8px; padding: 7px 9px; font-size: 12px; white-space: nowrap; }
    .sets { display: grid; gap: 8px; }
    .weight-bests { display: grid; gap: 8px; padding: 10px; background: #0e0e0e; border: 1px solid var(--line); border-radius: 8px; }
    .best-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .best-grid strong { display: block; font-size: 15px; margin-top: 4px; overflow-wrap: anywhere; }
    .best-up { color: var(--green); }
    .set-row { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 8px; }
    .check { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #202020; display: grid; place-items: center; font-weight: 900; }
    .check.done { background: var(--green); color: #04120c; border-color: var(--green); }
    input, textarea { width: 100%; border: 1px solid var(--line); background: #0e0e0e; color: var(--text); border-radius: 8px; padding: 10px; outline: 0; min-height: 40px; }
    textarea { resize: vertical; min-height: 74px; }
    .meal { display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .action { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
    .action.primary { background: linear-gradient(135deg, var(--fire), #ff8a2a); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .danger { border-color: rgba(248,113,113,.4); color: #fca5a5; }
    .setting-row { padding: 12px; display: grid; gap: 8px; }
    .switchline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mini { font-size: 12px; color: var(--muted); }
    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 25px; }
      main { padding-left: 10px; padding-right: 10px; }
    }
  </style>
</head>

      const day = structuredClone(baseDays.find(d => d.day === dayNo));

    function weightNumber(value) {
      if (typeof value !== "string" && typeof value !== "number") return null;
      const text = String(value).trim();
      if (!/^\d+(?:\.\d+)?$/.test(text)) return null;
      const number = Number(text);
      return Number.isFinite(number) && number >= 0 ? number : null;
    }
    function exerciseBests(item, week) {
      const assisted = /assisted.*pull/i.test(item.name);

        const match = /^w(\d+)d(\d+)$/.exec(key);
        if (!match) return;
        (workout[itemKey(item)]?.sets || []).forEach(set => {
          const weight = weightNumber(set?.weight);
          if (weight !== null) entries.push({ week: Number(match[1]), weight });
        });
      });
      const best = rows => rows.length ? rows.reduce((value, row) => assisted ? Math.min(value, row.weight) : Math.max(value, row.weight), rows[0].weight) : null;
      return { assisted, current: best(entries.filter(row => row.week === week)), previous: best(entries.filter(row => row.week === week - 1)), allTime: best(entries), earlier: best(entries.filter(row => row.week < week)) };

    function completedStats(w, d) {

        ${shoulderGuidanceHTML()}
        <details class="card"><summary>Original workbook reference</summary><p class="mini">${day.source}. Reference only; follow the adapted session below.</p><ul class="list-only">${originalDay(state.week,state.day).items.map(item => `<li>${item.name}: ${item.target}${item.kind === "exercise" ? ` × ${item.sets}; rest ${item.rest}` : ""}</li>`).join("")}</ul>${day.sourceRecovery ? `<p class="mini">${day.sourceRecovery}</p>` : ""}</details>
        <div class="card"><h3>Shoulder-blade maintenance</h3><p class="muted">Gentle optional exercises are included in sessions 1, 3 and 5. Start with one easy set; skip anything that irritates the shoulder. Face pulls can wait until light rowing and these movements are comfortable. This is not a diagnosis-specific rehabilitation programme.</p><textarea data-shoulder-recovery placeholder="Record tolerated exercises or physio guidance">${String(state.data.shoulderRecovery || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</textarea></div>
        <div class="card"><h3>Warm-up</h3><ul class="list-only">${day.warmup.map(x => `<li>${x}</li>`).join("") || "<li>Not specified in the original workbook.</li>"}</ul></div>
        ${day.items.map(item => itemHTML(day, item, saved[itemKey(item)] || {})).join("")}
        <div class="card"><h3>Optional Cooldown</h3><ul class="list-only">${day.cooldown.map(x => `<li>${x}</li>`).join("") || "<li>Not specified in the original workbook.</li>"}</ul></div>
        <div class="card"><h3>Day Notes</h3><textarea data-note="${workoutKey(state.week,state.day)}" placeholder="Anything useful from today...">${escapeHTML(saved.dayNote || "")}</textarea></div>
      </div>`;
    }

    function itemHTML(day, item, rec) {
      const key = `${workoutKey(day.week, day.day)}|${itemKey(item)}`;
      if (item.kind === "cardio") {
        return `<div class="exercise"><div class="exercise-head"><div><h3>${item.name}</h3><p class="muted">Target: ${item.target}</p></div>${item.video ? `<a class="demo" href="${item.video}" target="_blank" rel="noreferrer">Watch Demo</a>` : ""}</div>
          <p class="mini">${item.note}</p>
          <div class="set-row"><button class="check ${rec.done ? "done" : ""}" data-cardio="${key}">${rec.done ? "✓" : ""}</button><input data-cardio-note="${key}" value="${escapeHTML(rec.note || "")}" placeholder="Type time / incline / resistance"></div>
        </div>`;
      }
      return `<div class="exercise"><div class="exercise-head"><div><h3>${item.name}${item.optional ? ' · Optional' : ''}</h3><p class="muted">${item.target} x ${item.sets} · Rest ${item.rest}</p></div>${item.video ? `<a class="demo" href="${item.video}" target="_blank" rel="noreferrer">Watch Demo</a>` : ""}</div>
        <p class="mini">${item.note}</p>
        ${item.trackWeight ? `<div class="weight-bests" data-bests="${itemKey(item)}" aria-live="polite">${weightBestsHTML(item, day.week)}</div>` : ""}
        <div class="sets">${Array.from({ length: item.sets }, (_, i) => {
          const set = rec.sets?.[i] || {};
          return `<div class="set-row"><button class="check ${set.done ? "done" : ""}" data-set="${key}|${i}">${set.done ? "✓" : ""}</button>${item.trackWeight ? `<input data-weight="${key}|${i}" value="${escapeHTML(set.weight || "")}" placeholder="Set ${i+1}${i >= 2 ? ' (optional)' : ''} weight (${escapeHTML(state.data.settings.unit)})">` : `<span class="mini">Set ${i+1}${i >= 2 ? ' · Optional' : ''}</span>`}</div>`;
        }).join("")}</div></div>`;
    }

    function foodHTML() {
      const k = todayKey();
      const food = state.data.food[k] || {};
      return `<div class="stack"><div class="section-title"><h2>Food Tracker</h2><span class="pill">${k}</span></div>
        ${["Breakfast","Lunch","Pre-workout","Dinner","Snack"].map(meal => {
          const id = meal.toLowerCase().replace(/[^a-z]+/g,"");
          return `<div class="meal"><strong>${meal}</strong><button class="check ${food[id] ? "done" : ""}" data-meal="${id}" aria-label="${meal} completed" aria-pressed="${!!food[id]}">${food[id] ? "✓" : ""}</button></div>`;
        }).join("")}
        <div class="card stack"><h3>Diet log · Weeks 1 &amp; 2</h3><p class="muted">Your supplied review records the same daily plan for both weeks. These are reported daily figures, not measured weekly averages or a record of every meal eaten.</p>
          <div class="grid">${[1,2].map(week => `<div class="card stack"><h3>Week ${week}</h3><strong class="accent">2,062 kcal / day</strong><p class="muted">Protein 181 g · Carbs 194 g<br>Fat 70 g · Fibre 46 g</p><span class="pill">Reported meal plan</span></div>`).join("")}</div>
          <p class="mini">Report targets: 2,005 kcal · protein 170 g · carbs 185 g · fat 65 g · fibre 30 g. Figures reproduced as supplied; calorie and macro totals may not reconcile. Sodium was not assessed.</p>
        </div>
        <details class="card"><summary><strong>Weeks 1–2 · meals &amp; ingredients</strong></summary><div class="stack" style="margin-top:14px">
          <div><h3>Breakfast · Overnight oats</h3><p class="muted">Rolled oats, whey isolate, fat-free natural yogurt, unsweetened almond milk, chia seeds, strawberries, cacao, a small amount of agave and almonds.</p><p class="mini">Individual portions and breakfast macros were not supplied.</p></div>
          <div><h3>Lunch · Smoked salmon guacamole wrap</h3><p class="muted">Mission Carb Balance wrap, 100 g smoked salmon, 50 g baby spinach, 1 mini guacamole, approximately 50 g tzatziki and 10 g sriracha.</p><p class="mini">Approx. 517 kcal · protein 42 g · carbs 31 g · fat 29 g · fibre 16 g</p></div>
          <div><h3>Dinner · Chikkar chole &amp; chicken</h3><p class="muted">Chikkar chole, chicken breast, sweetcorn, carrot and cucumber.</p><p class="mini">Approx. 749 kcal · protein 67 g · carbs 94 g · fat 18 g · fibre 15 g. Portions were not supplied.</p></div>
          <div><h3>Snack · Arla protein chocolate drink</h3><p class="mini">Approx. 246 kcal · protein 27 g. Other macros were not supplied.</p></div>
        </div></details>
        <div class="card stack"><h3>Review at a glance</h3><p class="muted">The supplied report rates this plan 9.3/10, highlighting protein, fibre, fat quality, legumes, fruit and vegetables, and practical meal preparation.</p><p class="muted">Its follow-up points: check iodine coverage, rotate proteins and colourful plants, monitor fibre comfort, and check supplement labels for overlapping doses.</p><p class="mini">Reported supplements: vitamin D, EPA/DHA omega-3 and hair/nail gummies. Nutrient assessments and the score come from your report; exact micronutrient amounts were not supplied.</p></div>
        <details class="card"><summary><strong>Later weeks · high-level reference</strong></summary><div class="stack" style="margin-top:14px"><p class="muted">Previous plan targets, pending review after the two-week trial. These are reference figures, not logged intake or automatic calorie changes.</p>
          ${dietBlocks.slice(1).map(b => `<p class="muted"><strong>Weeks ${b.weeks}</strong> · ${b.calories.toLocaleString("en-GB")} kcal/day · ${Math.round(b.p)} g protein</p>`).join("")}
          <p class="mini">Review weight trend, hunger, energy and training recovery before choosing the next target.</p>
        </div></details>
        <p class="mini">Today's meal ticks record completion only; they do not calculate calories or macros or mark Week 1 or 2 complete.</p>
        <div class="card"><h3>Food Notes</h3><textarea data-food-note="${k}" placeholder="Optional note for today...">${escapeHTML(food.note || "")}</textarea></div>
      </div>`;
    }

    function exportHTML() {
      return `<div class="stack"><div class="section-title"><h2>Export Data</h2><span class="pill">Analysis ready</span></div>
        <button class="tile primary" data-export="json"><strong>Export JSON</strong><span>Best for future apps, servers, and full history</span></button>
        <button class="tile" data-export="csv"><strong>Export CSV</strong><span>Best for Excel, Sheets, and quick analysis</span></button>
        <div class="card"><h3>Includes</h3><p class="muted">Previous app workout records are preserved separately and included in exports. Current plan position, real timestamps, set ticks, weights, cardio notes, gym day notes, and food ticks by calendar date.</p></div>
      </div>`;
    }

    function settingsHTML() {
      return `<div class="stack"><div class="section-title"><h2>More</h2><span class="pill">Settings</span></div>
        ${globalThis.GymBackup?.panelHTML() || '<div class="card"><h3>Cloud backup</h3><p class="muted">Loading backup controls…</p></div>'}
        <button class="tile" data-go="export"><strong>Export Data</strong><span>Save your history before major changes</span></button>
        <button class="tile" data-go="stretches"><strong>Stretch Library</strong><span>Demo support by muscle group</span></button>
        <div class="setting-row"><div class="switchline"><strong>Weight unit</strong><input data-unit value="${escapeHTML(state.data.settings.unit)}" style="max-width:90px"></div></div>
        <div class="card"><h3>Reminder Message Bank</h3><p class="muted">V1 includes rotating breakfast, lunch, gym, and dinner lines. Browser push reminders need a server or installed PWA push setup, so this first version stores the message bank and settings for the next step.</p></div>
        <button class="tile danger" data-clear-start><strong>Protected Clear</strong><span>Requires typing DELETE on the next prompt</span></button>
      </div>`;
    }

    function bind() {
      globalThis.GymBackup?.bind();
      document.querySelectorAll("[data-shoulder-recovery]").forEach(t => t.oninput = () => { state.data.shoulderRecovery = t.value; save(); });
      document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => navigate(b.dataset.go));
      document.querySelectorAll("[data-week]").forEach(b => b.onclick = () => navigate("workout", { week: Number(b.dataset.week), day: null }));
      document.querySelectorAll("[data-day]").forEach(b => navigateOnClick(b, () => navigate("workout", { week: state.week, day: Number(b.dataset.day) })));
      document.querySelectorAll("[data-open-day]").forEach(b => b.onclick = () => { const [w,d] = b.dataset.openDay.split(",").map(Number); navigate("workout", { week: w, day: d }); });
      document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => toggleSet(b.dataset.set));
      document.querySelectorAll("[data-weight]").forEach(i => i.oninput = () => updateWeight(i.dataset.weight, i.value));
      document.querySelectorAll("[data-cardio]").forEach(b => b.onclick = () => toggleCardio(b.dataset.cardio));
      document.querySelectorAll("[data-cardio-note]").forEach(i => i.oninput = () => updateCardioNote(i.dataset.cardioNote, i.value));
      document.querySelectorAll("[data-note]").forEach(t => t.oninput = () => { ensureWorkout(t.dataset.note).dayNote = t.value; ensureWorkout(t.dataset.note).updatedAt = new Date().toISOString(); save(); });
      document.querySelectorAll("[data-meal]").forEach(b => b.onclick = () => toggleMeal(b.dataset.meal));
      document.querySelectorAll("[data-food-note]").forEach(t => t.oninput = () => { ensureFood(t.dataset.foodNote).note = t.value; save(); });
      document.querySelectorAll("[data-export]").forEach(b => b.onclick = () => exportData(b.dataset.export));
      document.querySelectorAll("[data-unit]").forEach(i => i.oninput = () => { state.data.settings.unit = i.value || "kg"; save(); });
      document.querySelectorAll("[data-clear-start]").forEach(b => b.onclick = protectedClear);
    }
    function navigateOnClick(el, fn) { el.onclick = fn; }
    function ensureWorkout(key) { return state.data.workouts[key] ||= { startedAt: new Date().toISOString(), updatedAt: new Date().toISOString() }; }
    function ensureFood(key) { return state.data.food[key] ||= {}; }
    function parseKey(raw) {
      const [wd, item, set] = raw.split("|");
      const rec = ensureWorkout(wd);
      rec[item] ||= {};
      return { wd, item, set: Number(set), rec, itemRec: rec[item] };
    }
    function toggleSet(raw) {
      const x = parseKey(raw);
      x.itemRec.sets ||= [];
      x.itemRec.sets[x.set] ||= {};
      x.itemRec.sets[x.set].done = !x.itemRec.sets[x.set].done;
      x.rec.updatedAt = new Date().toISOString();
      save(); render();
    }
    function updateWeight(raw, value) {
      const x = parseKey(raw);
      x.itemRec.sets ||= [];
      x.itemRec.sets[x.set] ||= {};
      x.itemRec.sets[x.set].weight = value;
      x.rec.updatedAt = new Date().toISOString();
      save();
      const exercise = (state.week && state.day ? planDay(state.week, state.day).items : []).find(item => itemKey(item) === x.item) || [...originalBlocks.flatMap(block => block.days), ...baseDays].flatMap(day => day.items).find(item => itemKey(item) === x.item);
      const panel = document.querySelector(`[data-bests="${x.item}"]`);
      if (panel && exercise) panel.innerHTML = weightBestsHTML(exercise, state.week);
    }
    function toggleCardio(raw) {
      const x = parseKey(raw + "|0");
      x.itemRec.done = !x.itemRec.done;
      x.rec.updatedAt = new Date().toISOString();
      save(); render();
    }
    function updateCardioNote(raw, value) {
      const x = parseKey(raw + "|0");
      x.itemRec.note = value;
      x.rec.updatedAt = new Date().toISOString();
      save();
    }
    function toggleMeal(id) {
      const f = ensureFood(todayKey());
      f[id] = !f[id];
      f.updatedAt = new Date().toISOString();
      save(); render();
    }
    function findLatest() {
      const keys = Object.entries(state.data.workouts);
      if (!keys.length) return null;
      keys.sort((a,b) => String(b[1].updatedAt || "").localeCompare(String(a[1].updatedAt || "")));
      const m = keys[0][0].match(/w(\d)d(\d)/);
      if (!m) return null;
      return { week: Number(m[1]), day: Number(m[2]), label: `Last touched ${new Date(keys[0][1].updatedAt || keys[0][1].startedAt).toLocaleString()}` };
    }
    function exportRows() {
      const rows = [];
      for (let w=1; w<=8; w++) for (let d=1; d<=7; d++) {
        const day = planDay(w,d), saved = state.data.workouts[workoutKey(w,d)] || {};
        day.items.forEach(item => {
          const rec = saved[itemKey(item)] || {};
          if (item.kind === "cardio") rows.push({ type:"workout", week:w, gymDay:d, focus:day.focus, exercise:item.name, set:"cardio", target:item.target, completed:!!rec.done, weight:"", note:rec.note||"", updatedAt:saved.updatedAt||"" });
          else for (let i=0; i<item.sets; i++) rows.push({ type:"workout", week:w, gymDay:d, focus:day.focus, exercise:item.name, set:i+1, target:item.target, completed:!!rec.sets?.[i]?.done, weight:rec.sets?.[i]?.weight||"", note:saved.dayNote||"", updatedAt:saved.updatedAt||"" });
        });
      }
      for (const [archiveType, archive] of [["previous-plan", state.data.previousPlanWorkouts], ["source-plan", state.data.sourcePlanWorkouts]]) {
      Object.entries(archive || {}).forEach(([key, saved]) => {
        const match = /^w(\d+)d(\d+)$/.exec(key);
        if (!match) return;
        Object.entries(saved).forEach(([exercise, rec]) => {
          if (!rec || typeof rec !== "object") return;
          if (Array.isArray(rec.sets)) rec.sets.forEach((set, i) => rows.push({type:archiveType,week:Number(match[1]),gymDay:Number(match[2]),exercise,set:i+1,weight:set?.weight??"",completed:!!set?.done,note:saved.dayNote||"",updatedAt:saved.updatedAt||""}));
          else rows.push({type:archiveType,week:Number(match[1]),gymDay:Number(match[2]),exercise,completed:!!rec.done,note:rec.note||saved.dayNote||"",updatedAt:saved.updatedAt||""});
        });
      });
      }
      Object.entries(state.data.food).forEach(([date, f]) => rows.push({ type:"food", date, breakfast:!!f.breakfast, lunch:!!f.lunch, preworkout:!!f.preworkout, dinner:!!f.dinner, snack:!!f.snack, note:f.note||"", updatedAt:f.updatedAt||"" }));
      return rows;
    }
    function exportData(kind) {
      const payload = kind === "json" ? JSON.stringify({ app:"Senthil Gym", exportedAt:new Date().toISOString(), data: state.data, rows: exportRows() }, null, 2) : toCSV(exportRows());
      const blob = new Blob([payload], { type: kind === "json" ? "application/json" : "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `senthil-gym-${new Date().toISOString().slice(0,10)}.${kind}`;
      a.click();
      URL.revokeObjectURL(url);
    }
    function toCSV(rows) {
      const heads = [...new Set(rows.flatMap(r => Object.keys(r)))];
      return [heads.join(","), ...rows.map(r => heads.map(h => `"${String(r[h] ?? "").replaceAll('"','""')}"`).join(","))].join("\n");
    }
    function protectedClear() {
      const answer = prompt("Type DELETE to clear local Senthil Gym data. Export first if you need a backup.");
      if (answer === "DELETE") {
        localStorage.removeItem("sg-data");
        location.reload();
      }
    }
    render();
    globalThis.gymBackupAdapter = { getData: () => state.data, render };
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(() => {});
  </script>
  <script type="module" src="./backup.mjs"></script>
</body>
</html>
